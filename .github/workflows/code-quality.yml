name: code-quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: [self-hosted, Linux, X64, runner-vps, ci-default]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Ensure native build toolchain
        run: |
          if command -v cc >/dev/null 2>&1 && command -v c++ >/dev/null 2>&1; then
            echo "Native toolchain already available"
            exit 0
          fi

          if ! command -v apt-get >/dev/null 2>&1; then
            echo "apt-get is unavailable on this runner; cannot install build toolchain" >&2
            exit 1
          fi

          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config libssl-dev
          else
            apt-get update
            apt-get install -y build-essential pkg-config libssl-dev
          fi

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
