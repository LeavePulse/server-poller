[package]
name = "server-poller"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tonic = "0.12"
prost = "0.13"
service-toolkit-rust = { git = "https://github.com/LeavePulse/service-toolkit.git", default-features = false, features = ["grpc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "0.27", features = ["tokio-comp"] }
prometheus = { version = "0.14", features = ["process"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tokio-util = "0.7"
thiserror = "2"
hickory-resolver = { version = "0.24", features = ["tokio-runtime", "system-config"] }

[dev-dependencies]
# Installs the git pre-commit/pre-push hooks from .cargo-husky/hooks on first
# `cargo test`. The hooks invoke the shared `lp-ci` gate, which is installed
# separately via `cargo install` (cargo can't `run -p` a git dependency).
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
